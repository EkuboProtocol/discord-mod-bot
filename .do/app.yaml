spec:
  name: discord-mod-bot
  workers:
    - name: moderation-bot
      github:
        repo: EkuboProtocol/discord-mod-bot
        branch: main
        deploy_on_push: true
      source_dir: /
      environment_slug: node-js
      instance_count: 1
      instance_size_slug: basic-xxs
      build_command: npm install
      run_command: npm start
      envs:
        - key: DISCORD_TOKEN
          scope: RUN
          type: SECRET
        - key: DISCORD_SERVER_ID
          scope: RUN
          value: "replace-with-your-server-id"
        - key: OPENAI_API_KEY
          scope: RUN
          type: SECRET
        - key: OPENAI_MODEL
          scope: RUN
          value: "gpt-3.5-turbo"
        - key: LOG_LEVEL
          scope: RUN
          value: "info"
        - key: CONTEXT_MESSAGE_COUNT
          scope: RUN
          value: "5"
        - key: TIMEOUT_DURATION
          scope: RUN
          value: "5"
        - key: MODERATED_CHANNELS
          scope: RUN
          value: ""
        - key: EXCLUDED_CHANNELS
          scope: RUN
          value: ""
        - key: EXCLUDED_ROLES
          scope: RUN
          value: ""
        - key: WELCOME_CHANNEL_ID
          scope: RUN
          value: ""
        - key: NOTIFICATION_CHANNEL_ID
          scope: RUN
          value: ""
        - key: IGNORED_PHRASES
          scope: RUN
          value: "gm"
