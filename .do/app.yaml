name: discord-mod-bot
workers:
  - name: moderation-bot
    github:
      repo: EkuboProtocol/discord-mod-bot
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    # No build_command: the Bun buildpack is auto-selected by bun.lock and runs
    # `bun install` itself. A custom command here runs in that buildpack, which
    # has no npm on PATH.
    run_command: bun run src/index.ts
    envs:
      - key: DISCORD_TOKEN
        type: SECRET
        scope: RUN_TIME
      - key: DISCORD_SERVER_ID
        type: SECRET
        scope: RUN_TIME
      - key: OPENAI_API_KEY
        type: SECRET
        scope: RUN_TIME
      - key: WELCOME_CHANNEL_ID
        scope: RUN_TIME
      - key: NOTIFICATION_CHANNEL_ID
        scope: RUN_TIME
      - key: EXCLUDED_ROLES
        scope: RUN_TIME
      - key: TIMEOUT_DURATION
        scope: RUN_TIME
      - key: OPENAI_MODEL
        value: gpt-4o-mini
        scope: RUN_TIME
      - key: IGNORED_PHRASES
        value: gm
        scope: RUN_TIME
      - key: CONTEXT_MESSAGE_COUNT
        value: '10'
        scope: RUN_TIME
      - key: LOG_LEVEL
        value: info
        scope: RUN_TIME